; SkateCity settings. Restart the game after changing anything here.

; Where your Skate 3 data is: the skate-data\assets folder of the
; 2010-Rust-Rewrite-Mashup release. Leave this commented out if it's unzipped
; in your Downloads folder; otherwise remove the ; and give the full path.
; skate_assets = C:\Games\2010-Rust-Rewrite-Mashup\skate-data\assets

; Key that starts and stops skating (Windows key code; 0x4B = K).
; Clicking both sticks in on the controller also works.
toggle_key = 0x4B

; ---- Ground scanning ----
; How far around Batman the ground is scanned, and how finely (metres).
scan_radius = 16
scan_spacing = 0.5
; Railings, benches and fences are looked for this close (metres).
thin_radius = 8
; Ray traces per frame while riding, and while starting.
rays_per_frame = 1000
start_rays_per_frame = 4000
; Find grind rails on ledges and railings.
; In the air: hold RB and push the left stick forward for a front flip, back
; for a backflip (needs about half a second of air).
; In the air, LB opens Batman's cape to glide; LB again drops him, and he is
; put back on the board when he lands.
rails = 1

; ---- Looks ----
; Pose Batman from the skater (0 = leave his own animation).
pose = 1
; Bend his legs so his feet stay on the board.
plant_feet = 1
; Batman's size relative to the skater.
body_scale = 1.05
; Draw the board.
board = 1
; The board's materials are picked from the game by name (see BmSDK.log for
; what was picked and the other candidates). To choose one yourself, put its
; full name after the = (for example board_grip_material = SomePackage.SomeMaterial).
board_grip_material =
board_metal_material =
board_wheel_material =
; Use Skate's camera while skating.
skate_camera = 1
; Show trick names and scores.
score_display = 1

; ---- Calibration ----
; Unreal units per metre in this game; 0 measures it from Batman.
units_per_metre = 0
; Height of Batman's head bone above his toes, in metres, for that measurement.
batman_height = 1.62
